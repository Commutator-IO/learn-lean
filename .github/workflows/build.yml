name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs elan at the version pinned in lean-toolchain, caches .lake,
      # then runs `lake build` over the libraries declared in lakefile.toml.
      #
      # No --wfail any more. The statements the curriculum asks for and this
      # repository does not prove are written down with `sorry`, which Lean
      # reports as a warning: keeping --wfail would have meant either hiding
      # those gaps or failing every build. The next step counts them instead.
      - uses: leanprover/lean-action@v1

      # A `sorry` is expected — an unnoticed one is not. Every admitted
      # statement is listed here, so that adding one shows up in the diff of a
      # build log rather than passing unseen.
      - name: List the admitted statements
        run: |
          echo "Statements written but not proved:"
          awk '/^(theorem|lemma|example) /{ decl = $2 }
               /^ *sorry$/{ printf "  %s: %s\n", FILENAME, decl }' \
            $(find courses -name '*.lean' | sort) | tee /tmp/admis.txt
          echo "::notice::$(wc -l < /tmp/admis.txt | tr -d ' ') admitted statements"

  # The French documents point at their Lean twin by line number. Adding a line
  # to a .lean file silently moves every anchor below it, and the site then pairs
  # nothing: statements lose their proof without anything failing. This catches
  # it, and needs neither Lean nor Mathlib.
  anchors:
    name: source anchors up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh and compare
        run: |
          python3 tools/generate-tex.py --liens
          if ! git diff --exit-code -- 'courses/**/*.tex'; then
            echo "::error::a .tex points at stale line numbers - run 'python3 tools/generate-tex.py --liens' and commit the result."
            exit 1
          fi

  lakefile:
    name: lakefile up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lakefile.toml is generated from the courses/ tree: it must be regenerated
      # and committed whenever a .lean file is added or removed.
      - name: Regenerate and compare
        run: |
          python3 tools/generate-lakefile.py
          if ! git diff --exit-code -- lakefile.toml; then
            echo "::error::lakefile.toml is out of date - run 'python3 tools/generate-lakefile.py' and commit the result."
            exit 1
          fi
