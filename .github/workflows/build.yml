name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs elan at the version pinned in lean-toolchain, caches .lake,
      # then runs `lake build` over the libraries declared in lakefile.toml.
      - uses: leanprover/lean-action@v1
        with:
          build-args: --wfail

  lakefile:
    name: lakefile up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lakefile.toml is generated from the cours/ tree: it must be regenerated
      # and committed whenever a .lean file is added or removed.
      - name: Regenerate and compare
        run: |
          python3 outils/generer-lakefile.py
          if ! git diff --exit-code -- lakefile.toml; then
            echo "::error::lakefile.toml is out of date - run 'python3 outils/generer-lakefile.py' and commit the result."
            exit 1
          fi
