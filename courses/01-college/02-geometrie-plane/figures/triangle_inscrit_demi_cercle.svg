<svg viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg"
     stroke="currentColor" fill="none" stroke-width="1.1"
     font-size="11" font-style="italic">
  <title>Triangle abc inscrit dans un cercle dont le côté [ac] est un diamètre</title>
  <style>text { fill: currentColor; stroke: none; }
         .l { font-size: 9.5px; }</style>
  <circle cx="110" cy="100" r="64" />
  <path d="M46,100 L174,100 M46,100 L137,42 L174,100" />
  <!-- L'équerre de l'angle droit : ses deux côtés sont parallèles à [ba] et à
       [bc], donc son coin est droit exactement quand l'angle en b l'est. -->
  <path d="M126,49 L133,60 L144,53" />
  <circle cx="110" cy="100" r="2.5" fill="currentColor" />
  <text x="32" y="105">a</text>
  <text x="180" y="105">c</text>
  <text x="140" y="36">b</text>
  <text x="104" y="116">o</text>
</svg>
