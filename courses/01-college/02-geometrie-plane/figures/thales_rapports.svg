<svg viewBox="0 0 230 180" xmlns="http://www.w3.org/2000/svg"
     stroke="currentColor" fill="none" stroke-width="1.1"
     font-size="11" font-style="italic">
  <title>Deux droites sécantes en a, coupées par les parallèles (bc) et (b'c')</title>
  <style>text { fill: currentColor; stroke: none; }
         .l { font-size: 9.5px; }</style>
  <path d="M30,150 L174,118 M30,150 L126,48 M174,118 L126,48" />
  <path d="M116,131 L88,89" stroke-dasharray="5 4" />
  <circle cx="30" cy="150" r="2.5" fill="currentColor" />
  <circle cx="174" cy="118" r="2.5" fill="currentColor" />
  <circle cx="126" cy="48" r="2.5" fill="currentColor" />
  <circle cx="116" cy="131" r="2.5" fill="currentColor" />
  <circle cx="88" cy="89" r="2.5" fill="currentColor" />
  <text x="18" y="156">a</text>
  <text x="180" y="122">b</text>
  <text x="130" y="42">c</text>
  <text x="112" y="148" class="l">a + t(b − a)</text>
  <text x="4" y="86" class="l">a + t(c − a)</text>
</svg>
