    <path d="M177,122 L232,122 L232,47 M177,122 L177,47" />
    <rect x="44" y="102.6" width="47.6" height="18.7" />
    <rect x="44" y="82.2" width="47.6" height="18.7" />
    <rect x="44" y="61.8" width="47.6" height="18.7" />
  </g>
  <g stroke-width="1.1">
    <path d="M102,57 Q139,40 170,57" />
    <path d="M170,57 l-8,-3 m8,3 l-6,6" />
  </g>
  <g fill="currentColor" stroke="none" font-size="12" text-anchor="middle">
    <text x="68" y="116">d</text><text x="68" y="96">c</text><text x="68" y="75">b</text>
    <text x="136" y="34" font-size="11">bascule, retournée</text>
