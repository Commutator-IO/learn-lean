<svg viewBox="0 0 316 150" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" fill="none">
  <title>Un graphe probabiliste à deux états : chaque flèche porte la probabilité de passer d'un état à l'autre</title>
  <g stroke-width="1.2">
    <circle cx="80" cy="75" r="22" /><circle cx="216" cy="75" r="22" />
    <path d="M99,64 Q148,34 197,64 M197,64 l-9,-1.5 m9,1.5 l-5.5,7" />
    <path d="M197,86 Q148,116 99,86 M99,86 l9,1.5 m-9,-1.5 l5.5,-7" />
    <path d="M62,63 Q18,75 62,87 M62,87 l-9,-2 m9,2 l-6,-7" />
    <path d="M234,87 Q278,75 234,63 M234,63 l9,2 m-9,-2 l6,7" />
  </g>
  <g fill="currentColor" stroke="none" font-size="13" text-anchor="middle" font-style="italic">
    <text x="80" y="80">A</text><text x="216" y="80">B</text>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle" font-style="italic">
    <text x="148" y="38">a</text><text x="148" y="120">b</text>
    <text x="20" y="79">1−a</text><text x="290" y="79">1−b</text>
  </g>
</svg>
